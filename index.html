<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--ac:#2f6fed;--ok:#1f9d63;--warn:#e08a00;--bad:#d93f3f;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121418;--card:#1c1f26;--tx:#eef0f4;--mu:#9aa1ad;--ac:#6b9bff;--ok:#3ec98a;--warn:#f0a93a;--bad:#ff6b6b;--bd:#2b2f38;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121418;--card:#1c1f26;--tx:#eef0f4;--mu:#9aa1ad;--ac:#6b9bff;--ok:#3ec98a;--warn:#f0a93a;--bad:#ff6b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:18px;margin:4px 0 12px}h2{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.big{font-size:32px;font-weight:700}.mu{color:var(--mu);font-size:13px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok);border-radius:6px}
.row{display:flex;gap:8px;margin-bottom:8px}.row>*{flex:1;min-width:0}
input,select,button{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
button{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border:0;font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--mu);padding:4px 8px}
.item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--bd)}
.item:first-of-type{border-top:0}
.cat{margin-bottom:10px}.cat .t{display:flex;justify-content:space-between;font-size:14px}
.lim{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.lim input{width:110px;text-align:right}
body{background:linear-gradient(160deg,#eef2ff,#fdf2f8 50%,#ecfeff) fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:linear-gradient(160deg,#1b1b3a,#2a1633 50%,#102a33) fixed}}
h1{font-size:26px;background:linear-gradient(90deg,#6366f1,#ec4899,#f59e0b);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;width:fit-content}
h2{color:#ec4899}
main>.card:nth-of-type(1){background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border:0}
main>.card:nth-of-type(2){background:linear-gradient(135deg,#0ea5e9,#10b981);color:#fff;border:0}
main>.card:nth-of-type(1) .mu,main>.card:nth-of-type(2) .mu{color:rgba(255,255,255,.9)}
main>.card:nth-of-type(1) b,main>.card:nth-of-type(2) b{color:#fff!important}
main>.card:nth-of-type(1) button.g{color:#fff;background:rgba(255,255,255,.2);margin-right:6px;border-radius:8px}
main>.card:nth-of-type(2) .bar{background:rgba(255,255,255,.3)}
main>.card:nth-of-type(3){border-top:4px solid #f59e0b}
main>.card:nth-of-type(4){border-top:4px solid #8b5cf6}
main>.card:nth-of-type(5){border-top:4px solid #ec4899}
#ov{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 24px}
#ov[hidden]{display:none}
.sheet{max-width:520px;margin:0 auto;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.bt{display:flex;gap:8px;margin-bottom:12px}.bt button{flex:1}
#stmt h3{margin:0 0 2px;font-size:20px}#stmt table{width:100%;border-collapse:collapse;font-size:13px;margin:10px 0}#stmt td,#stmt th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}#stmt td:nth-child(n+3),#stmt th:nth-child(n+3){text-align:right}
@media print{body *{visibility:hidden}#ov,#ov *{visibility:visible}#ov{position:absolute;overflow:visible}.bt{display:none!important}}
header{position:relative;overflow:hidden;border-radius:20px;padding:22px 18px;margin-bottom:14px;text-align:center;color:#fff;background:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(2px 2px at 90px 70px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 20px,#fde68a,transparent),radial-gradient(2px 2px at 240px 60px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 25px,#fde68a,transparent),linear-gradient(160deg,#0b1a4a,#5b2a86 55%,#ff5fa2);background-size:320px 100px,320px 100px,320px 100px,320px 100px,320px 100px,100% 100%;box-shadow:0 8px 24px rgba(236,72,153,.35);border:2px solid #f5c542}
header h1{margin:0 auto 4px;font-size:36px;background:linear-gradient(90deg,#fff3b0,#f5c542,#ffd9ec);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-family:Georgia,'Times New Roman',serif;font-style:italic}
header p{margin:0;font-size:12px;letter-spacing:.18em;color:#ffe4f1}
header .logo{width:88px;height:88px;border-radius:22px;border:2px solid #f5c542;display:block;margin:0 auto 8px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
header .gems{font-size:22px;letter-spacing:6px;margin-bottom:6px}
.tabs{display:flex;gap:6px;margin-bottom:8px}.tabs button{flex:1;background:transparent;color:var(--mu);border:1px solid var(--bd);padding:8px}.tabs button.on{background:linear-gradient(135deg,#6366f1,#ec4899);color:#fff;border:0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.mnav button{padding:6px 14px;font-size:16px}.mnav b{font-size:15px}
.tk{padding:9px 0;border-top:1px solid var(--bd)}.tk:first-child{border-top:0}.tk .t{display:flex;justify-content:space-between}.tk.today{background:rgba(99,102,241,.1);border-radius:8px;padding:9px 8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.chip{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);color:var(--mu)}
main>.card:nth-of-type(6){border-top:4px solid #ec4899}
</style>
</head>

<script>
const K='budget30k_v2';
const PAL=['#6366f1','#ec4899','#f59e0b','#10b981','#0ea5e9','#8b5cf6','#ef4444','#14b8a6'];
const DEF=[['Rent (1 meal incl.)',13500],['Lunch (₹200/day)',6000],['Transport (₹350 × 26 days)',9100],['Jio + Spotify',469],['Misc buffer',931]];
let S={lim:DEF.map(d=>({n:d[0],b:d[1]})),exp:[]};
try{const r=localStorage.getItem(K);if(r)S=JSON.parse(r)}catch(e){}
if(S.bal==null)S.bal=47139;
if(S.sip==null)S.sip=20000;
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const f=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const mk=()=>today().slice(0,7);
const paidIn=(m,c)=>c.b>0&&S.exp.filter(e=>e.c===c.n&&e.d.startsWith(m)).reduce((a,e)=>a+e.a,0)>=c.b;
function render(){
  const now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),dl=dim-now.getDate()+1;
  const me=S.exp.filter(e=>e.d.startsWith(mk()));
  const tot=S.lim.reduce((a,c)=>a+c.b,0),sp=me.reduce((a,e)=>a+e.a,0),left=tot-sp;
  $('mon').textContent=now.toLocaleString('en-IN',{month:'long',year:'numeric'});
  $('left').textContent=f(left);$('left').style.color=left<0?'#ffd1d1':'#fff';
  $('tot').textContent=f(tot);$('spent').textContent=f(sp);$('dl').textContent=dl;
  $('safe').textContent=f(Math.max(0,left)/dl);
  const p=tot?Math.min(100,sp/tot*100):0;$('pb').style.width=p+'%';$('pb').style.background=p>90?'#ff6b6b':p>70?'#fde047':'#fff';
  const cv=$('cat').value,sm=($('dt').value||today()).slice(0,7),open=S.lim.filter(c=>!paidIn(sm,c));
  $('cat').innerHTML=open.length?open.map(c=>'<option>'+esc(c.n)+'</option>').join(''):'<option value="">All categories paid ✓</option>';
  $('cat').disabled=!open.length;if(cv&&open.some(c=>c.n===cv))$('cat').value=cv;
  document.querySelectorAll('#quick button').forEach(b=>{const c=S.lim.find(x=>x.n===b.dataset.c);b.style.display=c&&paidIn(mk(),c)?'none':''});
  renderTrack();
  $('cats').innerHTML=S.lim.map((c,i)=>{const s=me.filter(e=>e.c===c.n).reduce((a,e)=>a+e.a,0),q=c.b?Math.min(100,s/c.b*100):100;
    return '<div class="cat"><div class="t"><span>'+c.n+'</span><span class="mu">'+f(s)+' / '+f(c.b)+'</span></div><div class="bar"><i style="width:'+q+'%;background:'+(s>c.b?'var(--bad)':PAL[i%PAL.length])+'"></i></div></div>'}).join('');
  const rec=[...me].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,15);
  $('list').innerHTML=rec.length?rec.map(e=>'<div class="item"><div><div>'+e.c+(e.n?' · '+esc(e.n):'')+'</div><div class="mu">'+e.d+'</div></div><div><b>'+f(e.a)+'</b><button class="g" data-id="'+e.id+'">✕</button></div></div>').join(''):'<div class="mu">No expenses yet.</div>';
  $('lims').innerHTML=S.lim.map((c,i)=>'<div class="lim"><span>'+c.n+'</span><input type="number" inputmode="numeric" data-i="'+i+'" value="'+c.b+'"></div>').join('');
  $('limtot').textContent=f(tot);$('bal').textContent=f(S.bal-S.sip);$('bal').style.color=S.bal-S.sip<0?'#ffd1d1':'#fff';$('bank').textContent=f(S.bal);$('sip').textContent=f(S.sip);
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('dt').value=today();$('dt').onchange=render;
$('add').onclick=()=>{const a=parseFloat($('amt').value);if(!(a>0)||!$('cat').value)return;
  S.exp.push({id:Date.now(),a,c:$('cat').value,n:$('note').value.trim(),d:$('dt').value||today()});S.bal-=a;
  $('amt').value='';$('note').value='';save();render()};
$('list').onclick=e=>{const id=e.target.dataset.id;if(id){const x=S.exp.find(x=>x.id==id);if(x)S.bal+=x.a;S.exp=S.exp.filter(x=>x.id!=id);save();render()}};
$('lims').onchange=e=>{const i=e.target.dataset.i;if(i!==undefined){S.lim[i].b=Math.max(0,parseFloat(e.target.value)||0);save();render()}};
$('reset').onclick=()=>{if(confirm('Clear all expenses this month? Balance stays unchanged.')){S.exp=S.exp.filter(e=>!e.d.startsWith(mk()));save();render()}};
$('setbal').onclick=()=>{const v=parseFloat(prompt('Current account balance (₹)',S.bal));if(!isNaN(v)){S.bal=v;save();render()}};
$('amt').onkeydown=e=>{if(e.key==='Enter')$('add').click()};
let ST='';
$('stm').onclick=()=>{const me=S.exp.filter(e=>e.d.startsWith(mk())).sort((a,b)=>a.d.localeCompare(b.d)||a.id-b.id);const sp=me.reduce((a,e)=>a+e.a,0);let b=S.bal+sp,rows='';const mn=new Date().toLocaleString('en-IN',{month:'long',year:'numeric'});ST='PRETTY PENNY - ACCOUNT STATEMENT\n'+mn+'\nOpening balance: '+f(b)+'\n\n';me.forEach(e=>{b-=e.a;rows+='<tr><td>'+e.d.slice(8)+'/'+e.d.slice(5,7)+'</td><td>'+e.c+(e.n?' - '+esc(e.n):'')+'</td><td>'+f(e.a)+'</td><td>'+f(b)+'</td></tr>';ST+=e.d+'  '+e.c+(e.n?' - '+e.n:'')+'  -'+f(e.a)+'  Bal '+f(b)+'\n'});ST+='\nTotal spent: '+f(sp)+'\nClosing balance: '+f(S.bal)+'\n';$('stmt').innerHTML='<h3>Account Statement</h3><div class="mu">Pretty Penny · '+mn+' · generated '+today()+'</div><p>Opening balance: <b>'+f(S.bal+sp)+'</b></p>'+(me.length?'<table><tr><th>Date</th><th>Details</th><th>Debit</th><th>Balance</th></tr>'+rows+'</table>':'<p class="mu">No expenses this month.</p>')+'<p>Total spent: <b>'+f(sp)+'</b><br>Closing balance: <b>'+f(S.bal)+'</b></p>';$('ov').hidden=false;$('ov').scrollTop=0};
$('cl').onclick=()=>{$('ov').hidden=true};
$('pr').onclick=()=>{window.print()};
$('sh2').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Statement',text:ST});else{await navigator.clipboard.writeText(ST);alert('Statement copied')}}catch(e){}};
$('shr').onclick=async()=>{const u='https://claude.ai/artifact/8s6ctTNQaHbgrhrJNeYx43';try{if(navigator.share)await navigator.share({title:'Pretty Penny',text:'Check out this budget tracker app',url:u});else{await navigator.clipboard.writeText(u);alert('Link copied')}}catch(e){}};
$('sipbtn').onclick=()=>{if(S.sip>0&&confirm('SIP of '+f(S.sip)+' debited? It will be deducted from your bank balance.')){S.bal-=S.sip;S.sip=0;save();render()}};
$('sipset').onclick=()=>{const v=parseFloat(prompt('SIP amount to keep aside (₹)',S.sip));if(!isNaN(v)&&v>=0){S.sip=v;save();render()}};
[['Lunch',200,'Lunch (₹200/day)'],['Transport',350,'Transport (₹350 × 26 days)']].forEach(q=>{const b=document.createElement('button');b.textContent='+ '+q[0]+' ₹'+q[1];b.dataset.c=q[2];b.onclick=()=>{S.exp.push({id:Date.now(),a:q[1],c:q[2],n:'',d:today()});S.bal-=q[1];save();render()};$('quick').appendChild(b)});
let TV='day',TM=mk();
const sn=n=>n.replace(/\s*\(.*\)\s*$/,'');
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pd=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10));
const dl2=s=>{const d=pd(s);return d.getDate()+' '+MN[d.getMonth()]+', '+DN[d.getDay()]};
function grp(list){const m={};list.forEach(e=>{m[e.c]=(m[e.c]||0)+e.a});return m}
function chips(list){const m=grp(list);return '<div class="chips">'+Object.keys(m).sort((a,b)=>m[b]-m[a]).map(k=>'<span class="chip">'+esc(sn(k))+' '+f(m[k])+'</span>').join('')+'</div>'}
function block(label,list,cls){const t=list.reduce((a,e)=>a+e.a,0);return '<div class="tk'+(cls||'')+'"><div class="t"><span>'+label+'</span><b>'+f(t)+'</b></div>'+chips(list)+'</div>'}
function renderTrack(){
  const me=S.exp.filter(e=>e.d.startsWith(TM)),y=+TM.slice(0,4),mo=+TM.slice(5,7),dim=new Date(y,mo,0).getDate();
  $('tml').textContent=MN[mo-1]+' '+y;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===TV));
  let h='';
  if(!me.length){h='<div class="mu">No expenses in this month.</div>'}
  else if(TV==='day'){
    const g={};me.forEach(e=>(g[e.d]=g[e.d]||[]).push(e));
    h=Object.keys(g).sort().reverse().map(d=>block(dl2(d),g[d],d===today()?' today':'')).join('');
  }else if(TV==='week'){
    const g={};me.forEach(e=>{const d=pd(e.d),k=new Date(d.getFullYear(),d.getMonth(),d.getDate()-((d.getDay()+6)%7)).getTime();(g[k]=g[k]||[]).push(e)});
    h=Object.keys(g).sort((a,b)=>b-a).map(k=>{const st=new Date(+k),en=new Date(+k);en.setDate(en.getDate()+6);
      const a=st.getMonth()===mo-1?st.getDate():1,z=en.getMonth()===mo-1?en.getDate():dim;
      return block(a+'–'+z+' '+MN[mo-1],g[k])}).join('');
  }else{
    const t=me.reduce((a,e)=>a+e.a,0),m=grp(me),dd=TM===mk()?new Date().getDate():dim;
    h='<div class="item"><span>Total spent</span><b>'+f(t)+'</b></div><div class="item"><span>Average per day</span><b>'+f(t/dd)+'</b></div>'+
      Object.keys(m).sort((a,b)=>m[b]-m[a]).map((k,i)=>{const p=t?m[k]/t*100:0;return '<div class="cat" style="margin-top:10px"><div class="t"><span>'+esc(sn(k))+'</span><span class="mu">'+f(m[k])+' · '+Math.round(p)+'%</span></div><div class="bar"><i style="width:'+p+'%;background:'+PAL[i%PAL.length]+'"></i></div></div>'}).join('');
  }
  $('tkb').innerHTML=h;
}
$('tabs').onclick=e=>{const v=e.target.dataset.v;if(v){TV=v;renderTrack()}};
const shiftM=n=>{const d=new Date(+TM.slice(0,4),+TM.slice(5,7)-1+n,1);TM=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');renderTrack()};
$('pm').onclick=()=>shiftM(-1);$('nm').onclick=()=>shiftM(1);
render();
</script>
</body>
</html>
